apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        location ~ ^/api/(tools|categories)(/|$) { proxy_pass http://tools-service:5000; }
        location ~ ^/api/customers(/|$)          { proxy_pass http://customers-service:5000; }
        location ~ ^/api/rentals(/|$)            { proxy_pass http://rentals-service:5000; }
        location ~ ^/api/maintenance(/|$)        { proxy_pass http://maintenance-service:5000; }

        location / { proxy_pass http://web-service:5000; }
    }
