apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: koptelovkir535363/tool-rental-web:latest
          ports:
            - containerPort: 5000
          env:
            - name: TOOLS_URL
              value: http://tools-service:5000
            - name: CUSTOMERS_URL
              value: http://customers-service:5000
            - name: RENTALS_URL
              value: http://rentals-service:5000
            - name: MAINTENANCE_URL
              value: http://maintenance-service:5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
