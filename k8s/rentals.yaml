apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentals
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite на ReadWriteOnce-томе: две копии одновременно запускать нельзя
  selector:
    matchLabels:
      app: rentals
  template:
    metadata:
      labels:
        app: rentals
    spec:
      containers:
        - name: rentals
          image: koptelovkir535363/tool-rental-rentals:latest
          ports:
            - containerPort: 5000
          env:
            - name: TOOLS_URL
              value: http://tools-service:5000
            - name: CUSTOMERS_URL
              value: http://customers-service:5000
          volumeMounts:
            - name: data
              mountPath: /app/instance
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rentals-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rentals-service
spec:
  selector:
    app: rentals
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rentals-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
