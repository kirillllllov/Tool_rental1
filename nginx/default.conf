resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(tools|categories)(/|$) {
        set $upstream_tools http://tools:5000;
        proxy_pass $upstream_tools;
    }
    location ~ ^/api/customers(/|$) {
        set $upstream_customers http://customers:5000;
        proxy_pass $upstream_customers;
    }
    location ~ ^/api/rentals(/|$) {
        set $upstream_rentals http://rentals:5000;
        proxy_pass $upstream_rentals;
    }
    location ~ ^/api/maintenance(/|$) {
        set $upstream_maintenance http://maintenance:5000;
        proxy_pass $upstream_maintenance;
    }

    location / {
        set $upstream_web http://web:5000;
        proxy_pass $upstream_web;
    }
}