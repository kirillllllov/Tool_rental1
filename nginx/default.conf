# Шлюз: единая точка входа. Интерфейс -> web, REST API -> соответствующий микросервис.
server {
    listen 80;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(tools|categories)(/|$) { proxy_pass http://tools:5000; }
    location ~ ^/api/customers(/|$)          { proxy_pass http://customers:5000; }
    location ~ ^/api/rentals(/|$)            { proxy_pass http://rentals:5000; }
    location ~ ^/api/maintenance(/|$)        { proxy_pass http://maintenance:5000; }

    location / { proxy_pass http://web:5000; }
}
